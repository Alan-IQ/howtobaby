name: Repository health

# Dedicated repository-health gate (docs/REPOSITORY_HEALTH.md §6). Runs on every push/PR without installing
# dependencies — scripts/check-repo-health.ts needs only Node >= 22.18 and Git — and again weekly so
# object-database growth is reported even when nothing is pushed. Hard-policy violations fail the job;
# budget warnings are annotations and appear in the job summary.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-health:
    name: Large-blob guard and size report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch for changed-blob comparison
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install git-sizer (optional deeper diagnostics)
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/git-sizer.zip https://github.com/github/git-sizer/releases/download/v1.5.0/git-sizer-1.5.0-linux-amd64.zip
          mkdir -p /tmp/git-sizer && unzip -q -o /tmp/git-sizer.zip -d /tmp/git-sizer
          sudo install -m 755 /tmp/git-sizer/git-sizer /usr/local/bin/git-sizer
          git-sizer --version

      - name: Repository health check
        run: node scripts/check-repo-health.ts --json=repo-health.json

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-health-${{ github.run_number }}
          path: repo-health.json
          if-no-files-found: ignore
          retention-days: 90
