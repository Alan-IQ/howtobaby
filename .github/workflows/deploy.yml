name: Deploy production

# Phase 0 placeholder — owned by docs/REPOSITORY_STRUCTURE.md §12 and docs/SYSTEM_ARCHITECTURE.md §13.
#
# Recorded decision (Phase 0): HowToBaby deploys static-first and stays server-capable. A full static export
# (`DEPLOY_TARGET=static` → `output: "export"`) is one deployment profile for shared hosting, never a permanent
# architecture constraint. The production pipeline (build → verify export → transfer to the host → smoke check)
# is described as a runbook in DEPLOYMENT_HAWKHOST.md and is implemented in Phase 1, once apps/web exists and
# the Phase 1 gate ("static-first build deploys; full-static export remains optional") can actually be tested.
#
# Until then this workflow is manual-only and exits non-zero without touching any host, so nothing can deploy
# by accident and no production secrets are required.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Production deploy (not implemented before Phase 1)
    runs-on: ubuntu-latest
    steps:
      - name: Not implemented
        run: |
          echo "::error title=Deploy production::Production deployment is a Phase 1 deliverable (docs/IMPLEMENTATION_ROADMAP.md). No build was produced and no host was contacted. See DEPLOYMENT_HAWKHOST.md for the prepared runbook."
          exit 1
