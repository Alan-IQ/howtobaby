name: Pipeline

# Primary CI/CD pipeline (docs/REPOSITORY_STRUCTURE.md §12, docs/REPOSITORY_HEALTH.md §6,
# docs/SYSTEM_ARCHITECTURE.md §13, DEPLOYMENT_HAWKHOST.md). One run per event, three logical jobs:
#
#   repository-health  full-history checkout, plain Node (no dependency install): large-blob guard,
#                      deny patterns, size report (+ optional git-sizer diagnostics).
#   quality-build      Node 24 + pinned pnpm, ONE dependency install, every remaining quality gate
#                      exactly once (typecheck, repository baseline, theme boundary, knowledge
#                      validation, strict license report, lint, tests, deterministic knowledge
#                      rebuild, default build, static export build + verification). On a production
#                      run the validated static export (apps/web/out) is uploaded as an artifact.
#   deploy-production  needs BOTH jobs above; main only; downloads the artifact quality-build made and
#                      never checks out, installs, tests or builds again (GitHub Environment
#                      `production`, HH_* secrets, sentinel-guarded rsync --delete, smoke checks).
#
# Trigger matrix:
#   pull_request      repository-health + quality-build; never deploys.
#   push (main)       repository-health ∥ quality-build → deploy-production.
#   schedule          repository-health only (weekly object-database growth report); no install/build/deploy.
#   workflow_dispatch manual validation; deploy only with `deploy: true` on refs/heads/main.
#
# Runtime: every project command runs on the Node version in .nvmrc (Node 24). Evidence Watch
# (evidence-watch.yml) stays a separate, manual-only Phase 9 concern.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to production after all gates pass (main only)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  repository-health:
    name: Repository health
    runs-on: ubuntu-latest
    # A newer push to the same ref supersedes this check; scoped per job + event so a scheduled run
    # never cancels the health gate of an in-flight production push (and vice versa).
    concurrency:
      group: pipeline-health-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout (full history for repository-health metrics)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch base branch for changed-blob comparison
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Set up Node.js (.nvmrc; no dependency install)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install git-sizer (optional deeper diagnostics)
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/git-sizer.zip https://github.com/github/git-sizer/releases/download/v1.5.0/git-sizer-1.5.0-linux-amd64.zip
          mkdir -p /tmp/git-sizer && unzip -q -o /tmp/git-sizer.zip -d /tmp/git-sizer
          sudo install -m 755 /tmp/git-sizer/git-sizer /usr/local/bin/git-sizer
          git-sizer --version

      - name: Repository health (large-blob guard, deny patterns, size report)
        run: node scripts/check-repo-health.ts --json=repo-health.json

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repo-health-${{ github.run_number }}
          path: repo-health.json
          if-no-files-found: ignore
          retention-days: 90

  quality-build:
    name: Quality gates and builds
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: pipeline-quality-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the project Node.js version (.nvmrc is the single source of truth)
        id: node
        run: echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"

      # pnpm/setup installs pnpm (version from package.json `packageManager`) and the Node runtime in
      # one step. Its built-in install is disabled so the single install below is explicitly frozen.
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ steps.node.outputs.version }}
          cache: true
          install: false

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Print toolchain
        run: |
          echo "node $(node --version)"
          echo "pnpm $(pnpm --version)"

      - name: Quality gates (typecheck, repository baseline, theme boundary, knowledge validation, strict licenses)
        run: pnpm check:quality

      - name: Lint
        run: pnpm lint

      # `pnpm test` rebuilds the gitignored derived knowledge read model first: apps/web integration
      # tests read packages/knowledge/generated through the repository.
      - name: Unit tests (theme contract, primitives, storage, knowledge graph, scripts)
        run: pnpm test

      - name: Deterministic knowledge rebuild (knowledge.sqlite + evidence indexes)
        run: pnpm check:knowledge-determinism

      - name: Build — default profile (static-first, server-capable)
        run: pnpm build

      - name: Build — static export profile (DEPLOY_TARGET=static)
        run: pnpm build:static

      - name: Verify static export
        run: |
          test -f apps/web/out/index.html || { echo "::error title=Static export::apps/web/out/index.html is missing"; exit 1; }
          test -f apps/web/out/404.html || { echo "::error title=Static export::apps/web/out/404.html is missing"; exit 1; }
          test -f apps/web/out/.htaccess || { echo "::error title=Static export::apps/web/out/.htaccess is missing"; exit 1; }
          echo "Static export OK: $(find apps/web/out -type f | wc -l) files, $(du -sh apps/web/out | cut -f1)"

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports-${{ github.run_number }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

      # Production candidates only (same condition as deploy-production): the validated export is
      # built exactly once here and reused by the deploy job.
      - name: Upload static export for deployment
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        uses: actions/upload-artifact@v7
        with:
          name: static-export-${{ github.sha }}
          path: apps/web/out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  deploy-production:
    name: Deploy production
    needs: [repository-health, quality-build]
    # Runs only when BOTH upstream gates succeeded, from main, on a push or an explicit manual deploy.
    if: >-
      success() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    # One production deploy at a time; a newer deploy waits — a transfer in progress is never cancelled.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://howtobaby.com
    steps:
      - name: Check that the production secrets are configured
        env:
          HH_SSH_HOST: ${{ secrets.HH_SSH_HOST }}
          HH_SSH_PORT: ${{ secrets.HH_SSH_PORT }}
          HH_SSH_USER: ${{ secrets.HH_SSH_USER }}
          HH_SSH_PRIVATE_KEY: ${{ secrets.HH_SSH_PRIVATE_KEY }}
          HH_SSH_KNOWN_HOSTS: ${{ secrets.HH_SSH_KNOWN_HOSTS }}
          HH_DEPLOY_PATH: ${{ secrets.HH_DEPLOY_PATH }}
        run: |
          missing=0
          for name in HH_SSH_HOST HH_SSH_PORT HH_SSH_USER HH_SSH_PRIVATE_KEY HH_SSH_KNOWN_HOSTS HH_DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error title=Deploy production::GitHub Environment 'production' secret $name is not set (see DEPLOYMENT_HAWKHOST.md)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          case "$HH_DEPLOY_PATH" in
            /*) ;;
            *) echo "::error title=Deploy production::HH_DEPLOY_PATH must be an absolute path"; exit 1 ;;
          esac

      - name: Download the static export built by quality-build
        uses: actions/download-artifact@v8
        with:
          name: static-export-${{ github.sha }}
          path: out

      - name: Verify downloaded export
        run: |
          test -f out/index.html || { echo "::error title=Deploy production::downloaded export has no index.html"; exit 1; }
          test -f out/.htaccess || { echo "::error title=Deploy production::downloaded export has no .htaccess"; exit 1; }

      - name: Configure SSH (deploy key + verified known_hosts)
        env:
          HH_SSH_PRIVATE_KEY: ${{ secrets.HH_SSH_PRIVATE_KEY }}
          HH_SSH_KNOWN_HOSTS: ${{ secrets.HH_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p $HOME/.ssh
          chmod 700 $HOME/.ssh
          printf '%s\n' "$HH_SSH_PRIVATE_KEY" > $HOME/.ssh/deploy_key
          chmod 600 $HOME/.ssh/deploy_key
          printf '%s\n' "$HH_SSH_KNOWN_HOSTS" > $HOME/.ssh/known_hosts
          chmod 644 $HOME/.ssh/known_hosts

      - name: Check deployment sentinel on the host
        env:
          HH_SSH_HOST: ${{ secrets.HH_SSH_HOST }}
          HH_SSH_PORT: ${{ secrets.HH_SSH_PORT }}
          HH_SSH_USER: ${{ secrets.HH_SSH_USER }}
          HH_DEPLOY_PATH: ${{ secrets.HH_DEPLOY_PATH }}
        run: |
          # StrictHostKeyChecking=yes: the host key must match HH_SSH_KNOWN_HOSTS exactly.
          ssh -i $HOME/.ssh/deploy_key -p "$HH_SSH_PORT" \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o BatchMode=yes -o ConnectTimeout=20 \
              "$HH_SSH_USER@$HH_SSH_HOST" \
              "test -d \"$HH_DEPLOY_PATH\" && test -f \"$HH_DEPLOY_PATH/.howtobaby-deploy-root\" && command -v rsync >/dev/null" \
            || { echo "::error title=Deploy production::HH_DEPLOY_PATH is missing, has no .howtobaby-deploy-root sentinel, or rsync is unavailable on the host — refusing rsync --delete"; exit 1; }
          echo "Sentinel present; document root is dedicated to HowToBaby."

      - name: Deploy with rsync
        env:
          HH_SSH_HOST: ${{ secrets.HH_SSH_HOST }}
          HH_SSH_PORT: ${{ secrets.HH_SSH_PORT }}
          HH_SSH_USER: ${{ secrets.HH_SSH_USER }}
          HH_DEPLOY_PATH: ${{ secrets.HH_DEPLOY_PATH }}
        run: |
          # --delete keeps the document root identical to the export. The sentinel, cPanel/AutoSSL paths and
          # cgi-bin are protected so a deploy never removes host-managed files.
          rsync --archive --compress --checksum --delete --delete-after \
                --human-readable --itemize-changes --stats \
                --exclude='.howtobaby-deploy-root' \
                --exclude='.well-known/' \
                --exclude='cgi-bin/' \
                -e "ssh -i $HOME/.ssh/deploy_key -p $HH_SSH_PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o BatchMode=yes" \
                out/ "$HH_SSH_USER@$HH_SSH_HOST:$HH_DEPLOY_PATH/"

      - name: Smoke check https://howtobaby.com
        run: |
          # Cloudflare/DNS propagation can lag the first deploy; retry briefly, then fail loudly.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/index.html -w '%{http_code}' --max-time 20 https://howtobaby.com/ || echo "000")
            if [ "$code" = "200" ] && grep -q 'data-theme="baby-modern-glass"' /tmp/index.html; then
              echo "howtobaby.com responded 200 with the HowToBaby shell (attempt $attempt)."
              break
            fi
            echo "Attempt $attempt: HTTP $code — retrying in 10s"
            [ "$attempt" -lt 6 ] || { echo "::error title=Smoke check::https://howtobaby.com did not serve the deployed shell (last status $code)"; exit 1; }
            sleep 10
          done

          # Canonical host: www must redirect to the apex over https (Cloudflare rule or origin .htaccess).
          www=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 https://www.howtobaby.com/ || echo "000")
          case "$www" in
            30[1278]\ https://howtobaby.com/*) echo "www.howtobaby.com redirects to the canonical host ($www)." ;;
            *) echo "::warning title=Canonical host::www.howtobaby.com did not redirect to https://howtobaby.com/ (got: $www). Check the Cloudflare redirect rule / DNS for www." ;;
          esac

      - name: Remove deploy key
        if: always()
        run: rm -f $HOME/.ssh/deploy_key
