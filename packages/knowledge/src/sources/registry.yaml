# Canonical source registry (docs/EVIDENCE_PROVENANCE.md §2, docs/REPOSITORY_STRUCTURE.md §8).
# A source record identifies the original authority; it is not permission to reproduce the work.
# Every `lastVerifiedAt` date means the source was actually opened on that date; `verifiedBy`
# records WHO opened it (`maintainer` or `ai-assisted`) so a date can never imply a human sign-off
# that did not happen (CLAUDE.md §5, GUIDANCE_CONTENT_CONTRACT.md §14).
#
# `publishedAt`/`updatedAt` are the authority's OWN calendar dates, copied exactly as the authority
# prints them to readers. Never derive them from machine metadata and never timezone-convert them:
# CDC pages, for example, print "Content last reviewed on Feb. 16, 2026" while their `og:updated_time`,
# `cdc:last_reviewed` metas and the desktop `<time datetime>` attribute carry the same instant shifted
# into UTC (2026-02-17T00:00) — reading those is how a +1 day drift gets into the registry.
# `approvalLevel`/`approvedScopes` are the machine-checkable approval boundary: only an
# approved-primary source can back `relationship: primary`/`direct-support`, and only inside
# its approved domains — a blog/retailer/influencer source can never become primary by declaration.

