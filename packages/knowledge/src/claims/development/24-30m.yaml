  - id: development.24-30m.safety-environment
    textKey: development.24-30m.safety-environment
    publicSlug: development-24-30-months-safety-environment
    guidanceClass: official-guidance
    precisionClass: source-exact
    safetyLevel: caution
    applicability:
      - "development-stage:dev-24-30m"
      - "cdc-checklist:2-years"
    sourceRefs:
      - sourceId: cdc-positive-parenting-toddlers-2-3
        relationship: primary
        locator:
          section: "Child safety first"
          paragraphHint: >-
            Sit when eating and chew thoroughly; check toys for loose or broken parts; no
            pencils or crayons in the mouth; no hot drinks with the child on your lap; harnessed
            car seat in the back seat; water supervision, fenced pools. Paraphrased.
        verifiedAt: 2026-09-03
      - sourceId: cdc-milestones-2-years
        relationship: direct-support
        locator:
          section: "Tips and Activities"
          paragraphHint: >-
            Screen time no more than 1 hour a day of a children's program with an adult present.
            Paraphrased.
        verifiedAt: 2026-09-03
    reviewedAt: 2026-09-03
    reviewStatus: source-verified

  - id: development.24-30m.what-not-to-force
    textKey: development.24-30m.what-not-to-force
    publicSlug: development-24-30-months-what-not-to-force
    guidanceClass: practical-interpretation
    precisionClass: product-heuristic
    safetyLevel: caution
