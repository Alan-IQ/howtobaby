      - "cdc-checklist:2-years"
    sourceRefs:
      - sourceId: cdc-milestones-2-years
        relationship: direct-support
        locator:
          section: "Tips and Activities"
          paragraphHint: >-
            Let the child eat as much or as little as they want; most children cannot toilet
            train until 2 to 3 years old and starting too early causes stress and setbacks;
            children this age play next to each other and do not share yet. Paraphrased.
        verifiedAt: 2026-09-03
    reviewedAt: 2026-09-03
    reviewStatus: source-verified

