  - id: development.04-06m.safety-environment
    textKey: development.04-06m.safety-environment
    publicSlug: development-4-6-months-safety-environment
    guidanceClass: official-guidance
    precisionClass: source-exact
    safetyLevel: caution
    applicability:
      - "development-stage:dev-04-06m"
      - "cdc-checklist:4-months"
    sourceRefs:
      - sourceId: cdc-positive-parenting-infants
        relationship: primary
        locator:
          section: "Child safety first"
          paragraphHint: >-
            Never shake; back to sleep; small bites, no small toys that can be swallowed;
            nothing over the face; no hot liquids near the baby; limit time in swings and
            bouncer seats; no screen media except video chatting under 18 months. Paraphrased.
        verifiedAt: 2026-09-03
      - sourceId: cdc-milestones-4-months
        relationship: direct-support
        locator:
          section: "Tips and Activities"
          paragraphHint: >-
            Let the baby mouth only things that are not sharp, hot or small enough to choke on;
            try not to keep the baby in swings, strollers or bouncy seats for too long; screen
            time only video calling under 2 years. Paraphrased.
        verifiedAt: 2026-09-03
      - sourceId: aap-baby-walkers-dangerous-choice
        relationship: direct-support
        locator:
          paragraphHint: >-
            Wheeled baby walkers send thousands of children to hospitals, can delay walking and
            offer no benefit; the AAP recommends stationary activity centers, play yards or high
            chairs instead. Paraphrased.
        verifiedAt: 2026-09-03
    reviewedAt: 2026-09-03
    reviewStatus: source-verified

  - id: development.04-06m.what-not-to-force
    textKey: development.04-06m.what-not-to-force
