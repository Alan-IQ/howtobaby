  - id: development.48-60m.safety-environment
    textKey: development.48-60m.safety-environment
    publicSlug: development-4-5-years-safety-environment
    guidanceClass: official-guidance
    precisionClass: source-exact
    safetyLevel: caution
    applicability:
      - "development-stage:dev-48-60m"
      - "cdc-checklist:4-years"
    sourceRefs:
      - sourceId: cdc-positive-parenting-preschoolers
        relationship: primary
        locator:
          section: "Child safety first"
          paragraphHint: >-
            Stay out of traffic; tricycle on the sidewalk with a helmet; check playground
            equipment; watch the child at all times outdoors; teach swimming but supervise
            around any water including kiddie pools; strangers. Paraphrased.
        verifiedAt: 2026-09-03
      - sourceId: cdc-milestones-4-years
        relationship: direct-support
        locator:
          section: "Tips and Activities"
          paragraphHint: >-
            Screen time no more than 1 hour per day of a children's program with an adult
            present; no screens in the bedroom; no screens for 1 to 2 hours before bed.
            Paraphrased.
        verifiedAt: 2026-09-03
    reviewedAt: 2026-09-03
    reviewStatus: source-verified

