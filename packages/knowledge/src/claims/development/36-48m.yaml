  - id: development.36-48m.safety-environment
    textKey: development.36-48m.safety-environment
    publicSlug: development-3-4-years-safety-environment
    guidanceClass: official-guidance
    precisionClass: source-exact
    safetyLevel: caution
    applicability:
      - "development-stage:dev-36-48m"
      - "cdc-checklist:3-years"
    sourceRefs:
      - sourceId: cdc-positive-parenting-preschoolers
        relationship: primary
        locator:
          section: "Child safety first"
          paragraphHint: >-
            Stay out of traffic; tricycle on the sidewalk with a helmet; check playground
            equipment; watch the child at all times, especially outdoors; water supervision
            including kiddie pools; safety around strangers. Paraphrased.
        verifiedAt: 2026-09-03
      - sourceId: cdc-milestones-3-years
        relationship: direct-support
        locator:
          section: "Tips and Activities"
          paragraphHint: >-
            Screen time no more than 1 hour per day of a children's program with an adult
            present; no screens in the child's bedroom. Paraphrased.
        verifiedAt: 2026-09-03
    reviewedAt: 2026-09-03
    reviewStatus: source-verified
    reviewedBy: ai-assisted

