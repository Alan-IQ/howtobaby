  - id: development.09-12m.safety-environment
    textKey: development.09-12m.safety-environment
    publicSlug: development-9-12-months-safety-environment
    guidanceClass: official-guidance
    precisionClass: source-exact
    safetyLevel: caution
    applicability:
      - "development-stage:dev-09-12m"
      - "cdc-checklist:9-months"
    sourceRefs:
      - sourceId: cdc-milestones-9-months
        relationship: primary
        locator:
          section: "Tips and Activities"
          paragraphHint: >-
            Baby-proof the home (sharp/breakable things out of reach; medicines, chemicals and
            cleaners locked away; Poison Help Line 800-222-1222 saved); choking risks; stay
            close as the baby explores; safe things to pull up on. Paraphrased.
        verifiedAt: 2026-09-03
      - sourceId: cdc-positive-parenting-infants
        relationship: direct-support
        locator:
          section: "Child safety first"
          paragraphHint: >-
            Cut food into small bites and no small objects that can be swallowed; back to sleep;
            no hot liquids near the baby; no screen media other than video chatting under 18
            months. Paraphrased.
        verifiedAt: 2026-09-03
      - sourceId: aap-baby-walkers-dangerous-choice
        relationship: direct-support
        locator:
          paragraphHint: >-
            Wheeled walkers: injuries (stairs, hot objects, water, poisons), no benefit, may
            delay walking. Paraphrased.
        verifiedAt: 2026-09-03
    reviewedAt: 2026-09-03
    reviewStatus: source-verified

  - id: development.09-12m.what-not-to-force
    textKey: development.09-12m.what-not-to-force
    publicSlug: development-9-12-months-what-not-to-force
    guidanceClass: practical-interpretation
    precisionClass: product-heuristic
    safetyLevel: caution
    applicability:
      - "development-stage:dev-09-12m"
      - "cdc-checklist:9-months"
    sourceRefs:
      - sourceId: cdc-milestones-9-months
        relationship: direct-support
        locator:
          section: "Tips and Activities"
          paragraphHint: >-
            Encourage crawling, scooting or rolling — whichever way the baby gets around; say a
            quick cheerful goodbye instead of sneaking away; pay attention to how the baby
            reacts to new people. Paraphrased.
        verifiedAt: 2026-09-03
      - sourceId: aap-baby-walkers-dangerous-choice
        relationship: direct-support
        locator:
          paragraphHint: >-
            Walkers offer no benefit and can delay walking. Paraphrased.
        verifiedAt: 2026-09-03
    reviewedAt: 2026-09-03
    reviewStatus: source-verified

