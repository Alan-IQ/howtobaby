          paragraphHint: >-
            Tummy time 2 to 3 times a day for 3 to 5 minutes from the first day home, working up
            to 15 to 30 minutes a day by 7 weeks; place yourself or a toy within reach.
            Paraphrased.
        supportNoteKey: development.00-02m.activities.note.who
        verifiedAt: 2026-09-03
      - sourceId: who-under-5-activity-sleep-guidelines-2019
        relationship: corroborating
        locator:
          section: "Recommendations"
          paragraphHint: >-
            Infants under 1 year: interactive floor-based play several times a day; for those
            not yet mobile, at least 30 minutes of tummy time spread through the day while
            awake. Paraphrased from the guideline summary.
        verifiedAt: 2026-09-03
