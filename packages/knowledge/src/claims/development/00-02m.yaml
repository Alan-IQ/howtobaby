  - id: development.00-02m.safety-environment
    textKey: development.00-02m.safety-environment
    publicSlug: development-0-2-months-safety-environment
    guidanceClass: official-guidance
    precisionClass: source-exact
    safetyLevel: caution
    applicability:
      - "development-stage:dev-00-02m"
      - "cdc-checklist:2-months"
    sourceRefs:
      - sourceId: cdc-positive-parenting-infants
        relationship: primary
        locator:
          section: "Child safety first"
          paragraphHint: >-
            Never shake a baby; always place the baby on the back to sleep; keep smoke away;
            nothing that could cover the face; no hot liquids near or while holding the baby.
            Paraphrased.
        verifiedAt: 2026-09-03
      - sourceId: aap-back-to-sleep-tummy-to-play
        relationship: direct-support
        locator:
          paragraphHint: >-
            Tummy time is only for babies who are awake and being watched; healthy babies sleep
            safest on their backs. Paraphrased.
        verifiedAt: 2026-09-03
      - sourceId: cdc-milestones-2-months
        relationship: direct-support
        locator:
          section: "Tips and Activities"
          paragraphHint: >-
            Tummy time with toys at eye level, never leaving the baby alone; if sleepy, back to
            a safe sleep area; never shake; screen time not recommended under 2 years except
            video calling. Paraphrased.
        verifiedAt: 2026-09-03
    reviewedAt: 2026-09-03
    reviewStatus: source-verified

  - id: development.00-02m.what-not-to-force
    textKey: development.00-02m.what-not-to-force
    publicSlug: development-0-2-months-what-not-to-force
    guidanceClass: practical-interpretation
    precisionClass: product-heuristic
    safetyLevel: caution
    applicability:
      - "development-stage:dev-00-02m"
      - "cdc-checklist:none-before-2-months"
    sourceRefs:
      - sourceId: aap-back-to-sleep-tummy-to-play
        relationship: direct-support
        locator:
          paragraphHint: >-
            Start tummy time short (3 to 5 minutes) and build up gradually; if the baby resists,
            put yourself or a toy within reach. Paraphrased.
        verifiedAt: 2026-09-03
      - sourceId: cdc-milestones-2-months
        relationship: direct-support
        locator:
          section: "Tips and Activities"
          paragraphHint: >-
            Notice and respond to the baby's signals, including turning away, yawning or fussing
            when the baby needs a break. Paraphrased.
        verifiedAt: 2026-09-03
    reviewedAt: 2026-09-03
    reviewStatus: source-verified

