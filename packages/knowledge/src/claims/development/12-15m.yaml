  - id: development.12-15m.safety-environment
    textKey: development.12-15m.safety-environment
    publicSlug: development-12-15-months-safety-environment
    guidanceClass: official-guidance
    precisionClass: source-exact
    safetyLevel: caution
    applicability:
      - "development-stage:dev-12-15m"
      - "cdc-checklist:1-year"
    sourceRefs:
      - sourceId: cdc-positive-parenting-toddlers-1-2
        relationship: primary
        locator:
          section: "Child safety first"
          paragraphHint: >-
            Water supervision (drowning is the leading cause of injury and death in this age
            group); stair gates; outlet covers; hot appliances and pot handles; sharp objects;
            never alone in a vehicle; poisons locked up. Paraphrased.
        verifiedAt: 2026-09-03
      - sourceId: cdc-milestones-1-year
        relationship: direct-support
        locator:
          section: "Tips and Activities"
          paragraphHint: >-
            Baby-proof the home; find out about choking foods; baby walkers are not recommended
            — let the child hold your hands or safe furniture instead; screen time only video
            calling under 2 years. Paraphrased.
        verifiedAt: 2026-09-03
      - sourceId: aap-baby-walkers-dangerous-choice
        relationship: direct-support
        locator:
          paragraphHint: >-
            Wheeled walkers: injuries on stairs, burns, drowning, poisoning; no benefit; may
            delay walking. Paraphrased.
        verifiedAt: 2026-09-03
    reviewedAt: 2026-09-03
    reviewStatus: source-verified
    reviewedBy: ai-assisted

  - id: development.12-15m.what-not-to-force
    textKey: development.12-15m.what-not-to-force
    publicSlug: development-12-15-months-what-not-to-force
    guidanceClass: practical-interpretation
    precisionClass: product-heuristic
