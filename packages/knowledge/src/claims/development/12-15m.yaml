    sourceRefs:
      - sourceId: cdc-milestones-1-year
        relationship: direct-support
        locator:
          section: "Tips and Activities"
          paragraphHint: >-
            Encourage walking practice by letting the child hold your hands or safe furniture;
            walkers not recommended; give the child time to get to know a new caregiver; save
            "no" for dangerous behaviors and redirect instead. Paraphrased.
        verifiedAt: 2026-09-03
      - sourceId: aap-baby-walkers-dangerous-choice
        relationship: direct-support
        locator:
          paragraphHint: >-
            Walkers can delay walking; no benefit. Paraphrased.
        verifiedAt: 2026-09-03
    reviewedAt: 2026-09-03
    reviewStatus: source-verified
    reviewedBy: ai-assisted

