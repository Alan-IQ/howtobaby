        relationship: direct-support
        locator:
          section: "Healthy bodies"
          paragraphHint: >-
            Keep the baby active on the floor rather than in restraining devices for long
            periods. Paraphrased.
        verifiedAt: 2026-09-03
      - sourceId: cdc-milestones-2-months
        relationship: direct-support
        locator:
          section: "Tips and Activities"
          paragraphHint: >-
