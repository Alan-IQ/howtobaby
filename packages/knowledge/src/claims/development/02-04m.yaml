  - id: development.02-04m.safety-environment
    textKey: development.02-04m.safety-environment
    publicSlug: development-2-4-months-safety-environment
    guidanceClass: official-guidance
    precisionClass: source-exact
    safetyLevel: caution
    applicability:
      - "development-stage:dev-02-04m"
      - "cdc-checklist:2-months"
    sourceRefs:
      - sourceId: cdc-positive-parenting-infants
        relationship: primary
        locator:
          section: "Child safety first"
          paragraphHint: >-
            Never shake; back to sleep; nothing over the face; no hot liquids near the baby;
            floor time rather than long spells in swings, strollers, bouncer seats or exercise
            saucers; no screen media except video chatting under 18 months. Paraphrased.
        verifiedAt: 2026-09-03
      - sourceId: aap-back-to-sleep-tummy-to-play
        relationship: direct-support
        locator:
          paragraphHint: >-
            Tummy time only while awake and watched; back sleeping; limiting time in swings and
            bouncy chairs also helps the head shape. Paraphrased.
        verifiedAt: 2026-09-03
    reviewedAt: 2026-09-03
    reviewStatus: source-verified

  - id: development.02-04m.what-not-to-force
    textKey: development.02-04m.what-not-to-force
