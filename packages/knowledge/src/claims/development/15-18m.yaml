  - id: development.15-18m.safety-environment
    textKey: development.15-18m.safety-environment
    publicSlug: development-15-18-months-safety-environment
    guidanceClass: official-guidance
    precisionClass: source-exact
    safetyLevel: caution
    applicability:
      - "development-stage:dev-15-18m"
      - "cdc-checklist:15-months"
    sourceRefs:
      - sourceId: cdc-positive-parenting-toddlers-1-2
        relationship: primary
        locator:
          section: "Child safety first"
          paragraphHint: >-
            Water supervision (drowning is the leading cause of injury and death in this age
            group); stair gates; outlet covers; hot appliances and pot handles; sharp objects;
            never alone in a vehicle; poisons locked up. Paraphrased.
        verifiedAt: 2026-09-03
      - sourceId: cdc-milestones-15-months
        relationship: direct-support
        locator:
          section: "Tips and Activities"
          paragraphHint: >-
            Baby-proof the home, lock away medicines and chemicals, save the Poison Help Line
            number 800-222-1222; screen time only video calling under 2 years. Paraphrased.
        verifiedAt: 2026-09-03
    reviewedAt: 2026-09-03
    reviewStatus: source-verified
    reviewedBy: ai-assisted

