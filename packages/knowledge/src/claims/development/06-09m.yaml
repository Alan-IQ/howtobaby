  - id: development.06-09m.safety-environment
    textKey: development.06-09m.safety-environment
    publicSlug: development-6-9-months-safety-environment
    guidanceClass: official-guidance
    precisionClass: source-exact
    safetyLevel: caution
    applicability:
      - "development-stage:dev-06-09m"
      - "cdc-checklist:6-months"
    sourceRefs:
      - sourceId: cdc-positive-parenting-infants
        relationship: primary
        locator:
          section: "Child safety first"
          paragraphHint: >-
            Small bites; no small toys or objects easy to swallow; nothing over the face; no hot
            liquids near the baby; back to sleep; limit time in swings and bouncer seats; no
            screen media except video chatting under 18 months. Paraphrased.
        verifiedAt: 2026-09-03
      - sourceId: cdc-milestones-6-months
        relationship: direct-support
        locator:
          section: "Tips and Activities"
          paragraphHint: >-
            Talk with the doctor about when to start solid foods and which foods are choking
            risks; screen time only video calling under 2 years. Paraphrased.
        verifiedAt: 2026-09-03
      - sourceId: aap-baby-walkers-dangerous-choice
        relationship: direct-support
        locator:
          paragraphHint: >-
            Wheeled walkers: injuries, no benefit, may delay walking; stationary activity
            centers, play yards and high chairs instead. Paraphrased.
        verifiedAt: 2026-09-03
    reviewedAt: 2026-09-03
    reviewStatus: source-verified
    reviewedBy: ai-assisted

  - id: development.06-09m.what-not-to-force
    textKey: development.06-09m.what-not-to-force
    publicSlug: development-6-9-months-what-not-to-force
    guidanceClass: practical-interpretation
    precisionClass: product-heuristic
    safetyLevel: caution
    applicability:
      - "development-stage:dev-06-09m"
      - "cdc-checklist:6-months"
    sourceRefs:
      - sourceId: cdc-milestones-6-months
        relationship: direct-support
        locator:
          section: "Tips and Activities"
          paragraphHint: >-
            Hold the baby up while she sits, with toys to look at while she learns to balance;
            read the baby's moods and take a break when upset. Paraphrased — CDC's tips say
            nothing about pillows.
        verifiedAt: 2026-09-03
      - sourceId: cdc-milestones-9-months
        relationship: direct-support
        locator:
          section: "Movement/Physical Development Milestones"
          paragraphHint: >-
            "Sits without support" is a 9-month checklist item, and no CDC checklist lists
            crawling at any age — the checklist membership facts behind the reference reminder.
        verifiedAt: 2026-09-03
      - sourceId: cdc-positive-parenting-infants
        relationship: direct-support
        locator:
          section: "Healthy bodies"
          paragraphHint: >-
            Try not to keep the baby in swings, bouncer seats or exercise saucers for too long;
            floor time builds strength. Paraphrased — a limit on time spent, not a ban on seats.
        verifiedAt: 2026-09-03
      - sourceId: aap-baby-walkers-dangerous-choice
        relationship: direct-support
        locator:
          paragraphHint: >-
            Wheeled walkers offer no benefit and can delay walking; stationary activity centers
            (no wheels; seats rotate, tip and bounce) are the safer alternative. Paraphrased —
            this AAP guidance covers wheeled walkers only.
        verifiedAt: 2026-09-03
    reviewedAt: 2026-09-03
    reviewStatus: source-verified
    reviewedBy: ai-assisted

