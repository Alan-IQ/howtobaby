locale: vi
strings:
  feeding.solids.start: >-
    Bắt đầu cho bé làm quen với các loại thức ăn khác ngoài sữa mẹ hoặc sữa công thức
    vào khoảng 6 tháng tuổi, khi bé có các dấu hiệu sẵn sàng về phát triển.
    Không khuyến nghị bắt đầu ăn dặm trước 4 tháng tuổi.
  guidance.feeding.solids-start.title: Bắt đầu ăn dặm
