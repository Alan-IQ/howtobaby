locale: vi
strings:
  feeding.solids.start: >-
    Cho bé bắt đầu làm quen với thức ăn ngoài sữa mẹ hoặc sữa công thức vào khoảng
    6 tháng tuổi, khi bé có các dấu hiệu cho thấy đã sẵn sàng về mặt phát triển.
    Không khuyến nghị bắt đầu cho bé ăn dặm trước 4 tháng tuổi.
  guidance.feeding.solids-start.title: Bắt đầu ăn dặm
