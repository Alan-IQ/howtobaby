locale: vi
strings:
  feeding.solids.start: >-
    Cho bé làm quen với thức ăn khác ngoài sữa mẹ hoặc sữa công thức khi bé được
    khoảng 6 tháng tuổi và có dấu hiệu đã sẵn sàng về phát triển. Không khuyến nghị
    cho bé ăn thức ăn đặc trước 4 tháng tuổi.
  guidance.feeding.solids-start.title: Bắt đầu ăn dặm
