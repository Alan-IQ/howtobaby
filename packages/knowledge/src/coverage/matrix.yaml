# Coverage matrix framework (docs/GUIDANCE_CONTENT_CONTRACT.md §11). Each cell declares, per
# stage × domain, the required sections a stage must ship with; every section pins the claims it
# requires together with the review floor, the locales that must carry the text, and whether an
# approved primary source covering the domain is mandatory:
#   stage × domain × required section × EN × VI × source coverage × review status.
# Phase 2 seeds one cell to prove the contract; domain migrations (Phases 4–6) grow it.

